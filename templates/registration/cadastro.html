{% extends 'layout.html' %}
{% block title %}Cadastre-se{% endblock %}

{% block corpo %}
<div class="caixa-form caixa-estreita">
  <h1 class="titulo-secao">Crie sua conta</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'form_campos.html' %}
    <button type="submit" class="btn btn-pet btn-grande w-100">Criar conta</button>
  </form>
  <p class="mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entre</a></p>
</div>
{% endblock %}
