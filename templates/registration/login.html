{% extends 'layout.html' %}
{% block title %}Entrar{% endblock %}

{% block corpo %}
<div class="caixa-form caixa-estreita">
  <h1 class="titulo-secao">Entrar</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'form_campos.html' %}
    <button type="submit" class="btn btn-pet btn-grande w-100">Entrar</button>
  </form>
  <p class="mt-3 mb-0">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock %}
