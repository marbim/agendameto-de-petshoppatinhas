{% for campo in form %}
  <div class="mb-3">
    <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}
    {% for erro in campo.errors %}<div class="text-danger small">{{ erro }}</div>{% endfor %}
  </div>
{% endfor %}
{% for erro in form.non_field_errors %}<div class="alert alert-danger">{{ erro }}</div>{% endfor %}
